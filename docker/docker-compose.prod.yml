# Docker Compose (Production)

services:
  # Backend (pre-built image from registry)
  app:
    image: ${BACKEND_IMAGE:-${ACR_REGISTRY}/quiz-backend:${IMAGE_TAG:-latest}}
    container_name: ${APP_CONTAINER_NAME:-quiz-backend}
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - ../server/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_TLS: ${REDIS_TLS:-false}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-app:}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-5000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 41s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend (pre-built image from registry)
  web:
    image: ${WEB_IMAGE:-${ACR_REGISTRY}/quiz-frontend:${IMAGE_TAG:-latest}}
    container_name: ${WEB_CONTAINER_NAME:-quiz-frontend}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - ../web/.env
    environment:
      NODE_ENV: ${WEB_NODE_ENV:-production}
      AI_AGENT_INTERNAL_URL: http://ai-agent:8000
    depends_on:
      app:
        condition: service_started
      ai-agent:
        condition: service_healthy
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-agent:
    image: ${AI_AGENT_IMAGE:-${ACR_REGISTRY}/quiz-ai-agent:${IMAGE_TAG:-latest}}
    container_name: ${AI_AGENT_CONTAINER_NAME:-quiz-ai-agent}
    restart: unless-stopped
    env_file:
      - path: ../ai-agent/config/.env
        required: false
    environment:
      BACKEND_URL: http://app:5000
      REDIS_URL: ${AI_REDIS_URL:-redis://redis-cache:6379/0}
      AI_REQUIRE_REDIS: "true"
      AI_ORCHESTRATION_MODE: ${AI_ORCHESTRATION_MODE:-agent_first}
      AI_EXECUTOR_MODEL: ${AI_EXECUTOR_MODEL:-}
      AI_EXECUTOR_API_KEY: ${AI_EXECUTOR_API_KEY:-}
      AI_EXECUTOR_BASE_URL: ${AI_EXECUTOR_BASE_URL:-}
      AI_EXECUTOR_REASONING_EFFORT: ${AI_EXECUTOR_REASONING_EFFORT:-}
      AI_EXECUTOR_TIMEOUT_SECONDS: ${AI_EXECUTOR_TIMEOUT_SECONDS:-60}
      AI_PLANNER_FAST_MODEL: ${AI_PLANNER_FAST_MODEL:-}
      AI_PLANNER_FAST_API_KEY: ${AI_PLANNER_FAST_API_KEY:-}
      AI_PLANNER_FAST_BASE_URL: ${AI_PLANNER_FAST_BASE_URL:-}
      AI_PLANNER_FAST_REASONING_EFFORT: ${AI_PLANNER_FAST_REASONING_EFFORT:-}
      AI_PLANNER_FAST_TIMEOUT_SECONDS: ${AI_PLANNER_FAST_TIMEOUT_SECONDS:-8}
      AI_PLANNER_STRONG_MODEL: ${AI_PLANNER_STRONG_MODEL:-}
      AI_PLANNER_STRONG_API_KEY: ${AI_PLANNER_STRONG_API_KEY:-}
      AI_PLANNER_STRONG_BASE_URL: ${AI_PLANNER_STRONG_BASE_URL:-}
      AI_PLANNER_STRONG_REASONING_EFFORT: ${AI_PLANNER_STRONG_REASONING_EFFORT:-}
      AI_PLANNER_STRONG_TIMEOUT_SECONDS: ${AI_PLANNER_STRONG_TIMEOUT_SECONDS:-25}
      AI_PLANNER_CONFIDENCE_THRESHOLD: ${AI_PLANNER_CONFIDENCE_THRESHOLD:-0.82}
      AI_PLANNER_ESCALATE_WRITES: ${AI_PLANNER_ESCALATE_WRITES:-true}
      AI_MODEL_MAX_RETRIES: ${AI_MODEL_MAX_RETRIES:-1}
      AI_LANGGRAPH_USE_RESPONSES_API: ${AI_LANGGRAPH_USE_RESPONSES_API:-false}
      AGENT_CHECKPOINTER: ${AGENT_CHECKPOINTER:-postgres}
      AI_CHECKPOINT_DATABASE_URL: ${AI_CHECKPOINT_DATABASE_URL:-${DATABASE_URL}}
      KNOWLEDGE_EMBEDDING_ENABLED: ${KNOWLEDGE_EMBEDDING_ENABLED:-false}
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-text-embedding-3-small}
      KNOWLEDGE_EMBEDDING_API_KEY: ${KNOWLEDGE_EMBEDDING_API_KEY:-}
      KNOWLEDGE_EMBEDDING_BASE_URL: ${KNOWLEDGE_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      CORS_ORIGINS: ${AI_AGENT_CORS_ORIGINS:-https://localhost}
      PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      app:
        condition: service_started
      redis-cache:
        condition: service_healthy
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-agent-worker:
    image: ${AI_AGENT_IMAGE:-${ACR_REGISTRY}/quiz-ai-agent:${IMAGE_TAG:-latest}}
    container_name: ${AI_AGENT_WORKER_CONTAINER_NAME:-quiz-ai-agent-worker}
    restart: unless-stopped
    env_file:
      - path: ../ai-agent/config/.env
        required: false
    environment:
      BACKEND_URL: http://app:5000
      REDIS_URL: ${AI_REDIS_URL:-redis://redis-cache:6379/0}
      AI_REQUIRE_REDIS: "true"
      AI_ORCHESTRATION_MODE: ${AI_ORCHESTRATION_MODE:-agent_first}
      AGENT_CHECKPOINTER: ${AGENT_CHECKPOINTER:-postgres}
      AI_CHECKPOINT_DATABASE_URL: ${AI_CHECKPOINT_DATABASE_URL:-${DATABASE_URL}}
      AGENT_QUEUE_KEY_PREFIX: ${AGENT_QUEUE_KEY_PREFIX:-quiz-ai:queue:}
      AGENT_QUEUE_LEASE_TTL_SECONDS: ${AGENT_QUEUE_LEASE_TTL_SECONDS:-300}
      AGENT_WORKER_POLL_TIMEOUT_SECONDS: ${AGENT_WORKER_POLL_TIMEOUT_SECONDS:-2}
    command: ["python", "scripts/run_worker.py"]
    depends_on:
      app:
        condition: service_started
      redis-cache:
        condition: service_healthy
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  db:
    image: postgres:${POSTGRES_VERSION:-15}
    container_name: ${DB_CONTAINER_NAME:-postgres-db}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-quiz}
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../server/prisma/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-quiz}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  redis-cache:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: ${REDIS_CONTAINER_NAME:-redis-cache}
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--appendfsync", "everysec",
      "--maxmemory", "${REDIS_MAX_MEMORY:-256mb}",
      "--maxmemory-policy", "allkeys-lru"
    ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Networks
networks:
  app-network:
    driver: bridge
    name: quiz-network

# Volumes
volumes:
  db-data:
    name: quiz-db-data
    driver: local
  redis-data:
    name: quiz-redis-data
    driver: local


